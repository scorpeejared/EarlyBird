name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify tag matches src/updater/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $match = Select-String -Path src/updater/version.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $code_version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $code_version) {
            Write-Error "Tag v$tag does not match src/updater/version.py's __version__ ($code_version). Bump __version__ and re-tag before releasing."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller EarlyBird.spec

      - name: Package release zip
        shell: pwsh
        run: |
          $zipName = "EarlyBird-${{ github.ref_name }}-windows.zip"
          # Zip the *contents* of dist/EarlyBird (exe + _internal at the zip
          # root) - installer.py's staging step expects those to be found
          # directly at the archive root, not nested one level down.
          Compress-Archive -Path "dist/EarlyBird/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
