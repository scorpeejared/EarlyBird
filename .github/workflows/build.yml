name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify tag matches src/updater/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $match = Select-String -Path src/updater/version.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $code_version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $code_version) {
            Write-Error "Tag v$tag does not match src/updater/version.py's __version__ ($code_version). Bump __version__ and re-tag before releasing."
            exit 1
          }

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name EarlyBird --clean --collect-all google.genai --collect-all openai --collect-all keyring --copy-metadata keyring main.py

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A onefile build is a single self-contained .exe, so it ships
          # unzipped - installer.stage_update() takes a raw executable
          # asset directly, and skipping the archive means one less step
          # between the download and the file swap.
          #
          # The asset filename must stay exactly "EarlyBird.exe" (no
          # version in it): update_manager decides what to relaunch by
          # matching the staged exe's name against the running one, so a
          # differently-named asset would land *beside* the installed exe
          # instead of replacing it, leaving the user on the old version.
          files: dist/EarlyBird.exe
          generate_release_notes: true

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          # Actions always wraps artifact contents in its own zip on
          # download, so nothing is pre-zipped here either.
          name: EarlyBird-${{ github.ref_name }}-windows
          path: dist/EarlyBird.exe
